<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6F7;--surface:#FFFFFF;--line:#E3E4E6;--text:#202223;--muted:#6D7175;
    --accent:#4F46E5;--accent-dark:#4338CA;--accent-soft:#EEF0FD;
    --red:#DC2626;--blue:#1D4ED8;--volt:#D6FA3C;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.03);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#121214;--surface:#1B1C1F;--line:#2E2F33;--text:#F2F2F3;--muted:#9A9B9E;--accent-soft:#232244;}
  }
  :root[data-theme="dark"]{--bg:#121214;--surface:#1B1C1F;--line:#2E2F33;--text:#F2F2F3;--muted:#9A9B9E;--accent-soft:#232244;}
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;font-size:14px;}
  .display{font-weight:700;letter-spacing:-0.015em;line-height:1.25;}
  [hidden]{display:none !important;}

  /* buttons + fields */
  .btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
  .btn:hover,.btn:focus-visible{background:var(--bg);}
  .btn.red{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.red:hover,.btn.red:focus-visible{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{background:var(--bg);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input,.field select,.inline-select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .field input:focus-visible,.field select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;}
  .inline-select{width:auto;padding:6px 8px;}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  /* login */
  .login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:min(400px,100%);box-shadow:0 4px 24px rgba(16,24,40,.06);}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-0.01em;}
  .login-card h1{font-size:24px;margin:22px 0 14px;font-weight:700;letter-spacing:-0.01em;}
  .note{font-size:12px;color:var(--muted);margin:16px 0 0;}

  /* shell */
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:100%;}
  aside{background:var(--surface);color:var(--text);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;}
  aside .brand{color:var(--text);padding:4px 10px 18px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav button{background:none;border:none;color:var(--muted);text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;}
  .nav button:hover{background:var(--bg);color:var(--text);}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav svg{flex:none;}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);}
  .side-foot button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;}
  .side-foot button:hover{color:var(--text);border-color:var(--text);background:var(--bg);}

  main{padding:28px 32px 48px;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;margin:0;}
  .who{color:var(--muted);font-size:13px;}

  /* dashboard */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);}
  .kpi span{display:block;color:var(--muted);font-size:13px;font-weight:500;}
  .kpi strong{display:block;font-weight:700;font-size:28px;margin-top:6px;letter-spacing:-0.01em;}
  .kpi small{color:var(--muted);}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .card h2{font-size:14px;margin:0 0 16px;font-weight:700;}
  .bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px;}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--muted);}
  .bar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:4px;}
  .bar:nth-child(odd) i{background:#A5B4FC;}
  .recent{list-style:none;margin:0;padding:0;}
  .recent li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .recent li:first-child{border-top:none;}

  /* tables */
  .tools{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tabs button{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:12px;}
  .tabs button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}
  .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);}
  .thumb-empty{display:block;background:linear-gradient(155deg,var(--bg) 0%,var(--bg) 55%,var(--swatch-c,var(--muted)) 55%,var(--swatch-c,var(--muted)) 100%);opacity:.8;}
  .imglist{display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto;}
  .imgrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .imgrow img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);}
  .imgmeta{flex:1;min-width:0;}
  .tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap;}
  td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle;}
  tr:first-child td{border-top:none;}
  tbody tr:hover td{background:var(--bg);}
  td.r,th.r{text-align:right;}
  .empty{padding:32px;text-align:center;color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .s-pending,.s-draft{background:#FEF3E2;color:#92400E;}
  .s-shipped{background:#EAF0FE;color:#1D4ED8;}
  .s-delivered,.s-active{background:#E8F7EE;color:#027A48;}
  .s-cancelled,.s-disabled,.s-admin{background:#FDECEC;color:#B42318;}
  .s-staff,.s-new{background:#EAF0FE;color:#1D4ED8;}
  .s-customer,.s-read{background:var(--bg);color:var(--muted);}
  :root[data-theme="dark"] .pill{filter:brightness(1.15) saturate(.85);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{filter:brightness(1.15) saturate(.85);}}
  .low{color:var(--red);font-weight:700;}
  .actions{display:flex;gap:6px;justify-content:flex-end;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(32,34,35,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(16,24,40,.18);}
  .modal h2{font-size:20px;margin:0 0 18px;font-weight:700;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(16,24,40,.2);}

  .formerr{color:var(--red);font-size:13px;margin:0 0 12px;}
  .formerr:empty{display:none;}
  .check{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:600;}
  .check input{width:auto;}
  .msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);}
  .msg header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;position:static;background:none;}
  .msg p{margin:6px 0 12px;white-space:pre-wrap;word-break:break-word;}
  .sub{color:var(--muted);font-size:12px;}
  .items{margin:0 0 14px;padding:0;list-style:none;}
  .items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .two{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .shell{grid-template-columns:1fr;}
    aside{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:12px 16px;border-right:none;border-bottom:1px solid var(--line);}
    aside .brand{padding:0 8px 0 0;}
    .nav{flex-direction:row;}
    .nav button{white-space:nowrap;}
    .side-foot{margin:0 0 0 auto;flex-direction:row;border-top:none;padding-top:0;}
    main{padding:20px 16px 40px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 22L11 2H22L13 22H2Z" fill="currentColor"/><path d="M14 22L21 7" stroke="#4F46E5" stroke-width="3"/></svg>
      Flex Admin
    </div>
    <h1 class="display">Sign in</h1>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="formerr" id="loginErr" role="alert"></p>
    <button class="btn red" type="submit" style="width:100%;">Sign in</button>
    <p class="note">Staff and admin accounts only. Passwords are stored as salted hashes and cannot be viewed by anyone.</p>
  </form>
</section>

<!-- APP -->
<div class="shell" id="app" hidden>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 22L11 2H22L13 22H2Z" fill="currentColor"/><path d="M14 22L21 7" stroke="#4F46E5" stroke-width="3"/></svg>
      Flex
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
      <button data-view="products"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4v10l8 4 8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Products</button>
      <button data-view="orders"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l2 5v13H4V8z"/><path d="M4 8h16"/></svg>Orders</button>
      <button data-view="users" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c1-4 4-6 7-6s6 2 7 6M17 4a4 4 0 010 8M22 21c-.5-3-2-5-4-5.6"/></svg>Users</button>
      <button data-view="drops"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Upcoming drops</button>
      <button data-view="messages"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v12H8l-4 4z"/></svg>Messages</button>
      <button data-view="activity" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity log</button>
    </nav>
    <div class="side-foot">
      <button id="themeBtn">Toggle theme</button>
      <button id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <main>
    <div class="topbar"><h1 class="display" id="title">Dashboard</h1><span class="who" id="who"></span></div>
    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script src="admin.js"></script>
</body>
</html>
