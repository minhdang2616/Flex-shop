<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flex Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F5;--surface:#FFFFFF;--line:#E5E5E5;--text:#111111;--muted:#707072;
    --side:#111111;--red:#FF3B2E;--blue:#1E3FFF;--volt:#D6FA3C;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#0E0E10;--surface:#17181A;--line:#2C2C2E;--text:#F5F4F2;--muted:#9A9A9C;--side:#000000;}
  }
  :root[data-theme="dark"]{--bg:#0E0E10;--surface:#17181A;--line:#2C2C2E;--text:#F5F4F2;--muted:#9A9A9C;--side:#000000;}
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;font-size:14px;}
  button,input,select{font-family:inherit;font-size:14px;}
  .display{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1;}
  [hidden]{display:none !important;}

  /* buttons + fields */
  .btn{background:var(--text);color:var(--surface);border:none;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;}
  .btn:hover,.btn:focus-visible{opacity:.85;}
  .btn.red{background:var(--red);color:#fff;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input,.field select,.inline-select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;}
  .inline-select{width:auto;padding:6px 8px;}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:1px;}

  /* login */
  .login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:min(400px,100%);}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.02em;}
  .login-card h1{font-size:28px;margin:22px 0 6px;}
  .note{font-size:12px;color:var(--muted);margin:16px 0 0;}

  /* shell */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100%;}
  aside{background:var(--side);color:#F5F4F2;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;}
  aside .brand{color:#fff;padding:0 10px 18px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav button{background:none;border:none;color:#B9B9BB;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:10px;}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav button.active{background:var(--red);color:#fff;}
  .nav svg{flex:none;}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
  .side-foot button{background:none;border:1px solid rgba(255,255,255,.2);color:#B9B9BB;border-radius:999px;padding:8px 12px;cursor:pointer;}
  .side-foot button:hover{color:#fff;border-color:#fff;}

  main{padding:28px 32px 48px;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .topbar h1{font-size:32px;margin:0;}
  .who{color:var(--muted);font-size:13px;}

  /* dashboard */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .kpi span{display:block;color:var(--muted);font-size:12px;font-weight:600;}
  .kpi strong{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:32px;margin-top:6px;letter-spacing:.01em;}
  .kpi small{color:var(--muted);}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .card h2{font-size:14px;margin:0 0 16px;font-weight:700;}
  .bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px;}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--muted);}
  .bar i{display:block;width:100%;background:var(--red);border-radius:6px 6px 0 0;min-height:4px;}
  .bar:nth-child(odd) i{background:var(--text);}
  .recent{list-style:none;margin:0;padding:0;}
  .recent li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .recent li:first-child{border-top:none;}

  /* tables */
  .tools{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tabs button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:12px;}
  .tabs button.active{background:var(--text);color:var(--surface);border-color:var(--text);}
  .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--g100,#eee);}
  .thumb-empty{display:block;background:linear-gradient(155deg,var(--bg) 0%,var(--bg) 55%,var(--swatch-c,var(--muted)) 55%,var(--swatch-c,var(--muted)) 100%);opacity:.8;}
  .imglist{display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto;}
  .imgrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .imgrow img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);}
  .imgmeta{flex:1;min-width:0;}
  .tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle;}
  tr:first-child td{border-top:none;}
  td.r,th.r{text-align:right;}
  .empty{padding:32px;text-align:center;color:var(--muted);}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent);}
  .s-pending,.s-draft{color:#B45309;}
  .s-shipped{color:var(--blue);}
  .s-delivered,.s-active{color:#15803D;}
  .s-cancelled{color:var(--red);}
  .low{color:var(--red);font-weight:700;}
  .actions{display:flex;gap:6px;justify-content:flex-end;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;}
  .modal h2{font-size:24px;margin:0 0 18px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;}

  .formerr{color:var(--red);font-size:13px;margin:0 0 12px;}
  .formerr:empty{display:none;}
  .s-admin{color:var(--red);}.s-staff{color:var(--blue);}.s-customer{color:var(--muted);}.s-disabled{color:var(--red);}.s-new{color:var(--blue);}.s-read{color:var(--muted);}
  .check{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:600;}
  .check input{width:auto;}
  .msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px;}
  .msg header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;position:static;background:none;}
  .msg p{margin:6px 0 12px;white-space:pre-wrap;word-break:break-word;}
  .sub{color:var(--muted);font-size:12px;}
  .items{margin:0 0 14px;padding:0;list-style:none;}
  .items li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);}
  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .two{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .shell{grid-template-columns:1fr;}
    aside{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:12px 16px;}
    aside .brand{padding:0 8px 0 0;}
    .nav{flex-direction:row;}
    .nav button{white-space:nowrap;}
    .side-foot{margin:0 0 0 auto;flex-direction:row;}
    main{padding:20px 16px 40px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 22L11 2H22L13 22H2Z" fill="currentColor"/><path d="M14 22L21 7" stroke="#FF3B2E" stroke-width="3"/></svg>
      Flex Admin
    </div>
    <h1 class="display">Sign in</h1>
    <div class="field" id="emField" hidden><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="formerr" id="loginErr" role="alert"></p>
    <button class="btn red" type="submit" style="width:100%;">Sign in</button>
    <p class="note"><button type="button" id="modeLink" style="background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;">Staff account? Sign in with email</button></p>
    <p class="note">Passwords are stored as salted hashes and cannot be viewed by anyone.</p>
  </form>
</section>

<!-- APP -->
<div class="shell" id="app" hidden>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 22L11 2H22L13 22H2Z" fill="#fff"/><path d="M14 22L21 7" stroke="#FF3B2E" stroke-width="3"/></svg>
      Flex
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
      <button data-view="products"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4v10l8 4 8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Products</button>
      <button data-view="orders"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l2 5v13H4V8z"/><path d="M4 8h16"/></svg>Orders</button>
      <button data-view="users" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c1-4 4-6 7-6s6 2 7 6M17 4a4 4 0 010 8M22 21c-.5-3-2-5-4-5.6"/></svg>Users</button>
      <button data-view="drops"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Upcoming drops</button>
      <button data-view="messages"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v12H8l-4 4z"/></svg>Messages</button>
      <button data-view="activity" data-admin><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity log</button>
    </nav>
    <div class="side-foot">
      <button id="themeBtn">Toggle theme</button>
      <button id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <main>
    <div class="topbar"><h1 class="display" id="title">Dashboard</h1><span class="who" id="who"></span></div>
    <div id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script src="admin.js"></script>
</body>
</html>
